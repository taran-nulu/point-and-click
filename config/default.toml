# Every tunable for point-and-click. This file is read at startup; nothing here
# requires editing code.

# Which gesture clicks: "middle-finger", "pinch", or "two-hand".
# Overridden by the --click-method flag on `pnc run`.
click_method = "middle-finger"

# What the pointing ray pivots about: "wrist" or "elbow".
# Overridden by the --pivot flag on `pnc run`.
#
# "elbow" means rotating your forearm aims, instead of rotating your wrist.
# It loads a second model to find your elbow (+5.8 MB, +8 ms inference, which
# currently still fits inside the frame budget), and it needs a wider view -
# your arm has to be in frame. If your arm drops out of frame it falls back to
# the wrist automatically.
pivot = "wrist"

[camera]
index = 0          # 0 is the built-in MacBook camera
width = 640
height = 480
fps = 30
mirror = true      # flip x once at input so "my right" == "cursor right"

[aim]
# The wrist-anchored model: the index fingertip is placed at a fixed distance
# from the camera, measured in units of hand size, anchored at the wrist.
#
#   u = wrist + (index_tip - wrist) * (gain / scale)
#
# (tip - wrist) / scale is the fingertip's distance from the wrist in
# hand-lengths, so gain says how many hand-lengths out you project to. An index
# finger is ~1.1 hand-lengths, meaning:
#
#   1.0  = target sits exactly on the fingertip (no gain)
#   0.5  = halfway back to the wrist; pointing direction dominates (default)
#   >1.5 = overshoots; the cursor jams into a corner and stops responding
#
# Press +/- while running to tune live, then put the value here to keep it.
# See README.md.
gain = 0.5

# The same setting when pivoting from your elbow. The elbow-to-fingertip lever
# is ~2.4x the wrist-to-fingertip one, so at the same gain the cursor would
# swing ~2.5x further for the same forearm rotation - every motion exaggerated
# and every wobble amplified. gain / 2.5 lands here.
#
# This is a starting point, not a law: your arm proportions and how you move
# decide the right value. Use +/- with --pivot elbow to find it.
gain_elbow = 0.2

[arm]
# Used by the "elbow" pivot only.

# Pose confidence required before an elbow is trusted. If your shoulders leave
# the frame, MediaPipe keeps *emitting* elbow coordinates that no longer mean
# anything, and a long lever amplifies that into a wild jump. Raising this
# makes the fallback to the wrist happen sooner; lowering it risks trusting a
# bad fix.
min_visibility = 0.5

# Which elbow to use: "auto" (follows the hand tracker's handedness), or force
# "left"/"right". The override exists for the case where auto picks the wrong
# arm because of how the mirrored frame reads.
side = "auto"

# Pose model size: lite (~5.8 MB), full, or heavy.
model = "lite"

median_window = 3  # landmark outlier rejection; 1 disables
min_cutoff = 1.2   # 1 Euro filter. Lower = smoother but laggier.
beta = 0.02        # 1 Euro filter. Higher = less lag when moving fast.

[gesture]
# Click = fold your middle finger. Unfold to release. Supports click-drag.
#
#   extension = |middle_tip - wrist| / |middle_pip - wrist|
#
# The two thresholds differ on purpose (hysteresis) so a hand resting near the
# boundary does not chatter open and shut. Set these from your own measured
# range: `pnc doctor --gestures`.
extend_ratio = 1.35
fold_ratio = 1.15
confirm_frames = 2
max_hold_ms = 2000  # auto-release, so a misdetected fold cannot stick the mouse

[pinch]
# Click = bring the thumb tip to the index tip.
#
#   gap = |thumb_tip - index_tip| / hand_scale
#
# A pinched hand measures ~0.1-0.2; a hand at rest measures ~0.5-0.9.
# release_ratio must exceed press_ratio (hysteresis band).
press_ratio = 0.35
release_ratio = 0.50

# Pinching curls the index finger - the finger doing the aiming - so the cursor
# would slide as you close the pinch. Latching pins the click where you aimed.
# The trade-off: pinch cannot drag. Use the middle-finger method for dragging.
freeze_on_press = true

[two_hand]
# Click = close the *other* hand into a fist, while this hand points. Opening it
# releases. Because the click comes from a different hand, it cannot disturb
# your aim at all, and drag works.
#
#   openness = mean over index/middle/ring/pinky of
#              |tip - wrist| / |pip - wrist|
#
# Measured on a real resting hand: p5=0.52, median 0.92, p95=1.57. A deliberate
# fist lands well under that spread, so fist_ratio sits below the resting p25 -
# any higher and resting on its own triggers clicks. open_ratio sits just below
# the resting median, because after a click you relax your hand rather than
# splaying it flat, and requiring a flat open hand leaves the button held down.
#
# The margin is thin, because a relaxed hand and a fist are not hugely different
# signals. `pnc doctor --gestures` - run while you actually clench and release -
# tells you whether your hand reaches these.
fist_ratio = 0.60
open_ratio = 0.85

# Which hand aims: "auto", "left", or "right".
#
# "auto" picks the hand whose index finger is extended relative to its other
# three, which tells a pointing hand from a fist by a wide margin, and sticks to
# that answer so the roles cannot flap. The preview prints the assignment on a
# `pointing hand:` line - if it names the wrong hand, pin it here.
pointing_hand = "auto"

# 0 disables the hold timeout, so a fist stays down until you open it.
#
# A long hold is the point of this gesture - selecting text, dragging a window
# - so capping it would break the gesture rather than protect you. Every other
# safety net still applies: losing your hands, pausing, switching method, and
# quitting all force a release.
max_hold_ms = 0

[safety]
hand_lost_release_ms = 250  # release the button this soon after losing your hand
resume_grace_ms = 1500     # after the real mouse is touched, wait this long before resuming

[preview]
enabled = true
window = "point-and-click"